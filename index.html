<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>TSP - Path Optimizers</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    
    #map {
      height: 100vh;
      width: 100%;
    }
    
    .controlBox {
      position: absolute;
      z-index: 1000;
      background: white;
      padding: 12px 16px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
      font-size: 14px;
    }
    
    #fileControl {
      bottom: 10px;
      left: 10px;
      max-width: 300px;
    }
    
    #algorithmsControl {
      bottom: 10px;
      right: 10px;
      max-width: 300px;
    }
    
    #resultsContainer {
      top: 10px;
      right: 10px;
      max-width: 280px;
      max-height: 80vh;
      overflow-y: auto;
    }
    
    h3 {
      margin: 0 0 12px 0;
      font-size: 16px;
      color: #333;
      border-bottom: 2px solid #007bff;
      padding-bottom: 6px;
    }
    
    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      color: #555;
    }
    
    input[type="file"] {
      display: block;
      margin-bottom: 8px;
      font-size: 13px;
    }
    
    input[type="number"] {
      width: 80px;
      padding: 6px 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 14px;
    }
    
    button {
      padding: 8px 16px;
      border: none;
      cursor: pointer;
      border-radius: 6px;
      background: #007bff;
      color: white;
      font-size: 14px;
      font-weight: 600;
      transition: background 0.2s;
      margin-top: 8px;
      width: 100%;
    }
    
    button:hover:not(:disabled) {
      background: #0056b3;
    }
    
    button:active:not(:disabled) {
      background: #004085;
    }
    
    button:disabled {
      background: #ccc;
      cursor: not-allowed;
      opacity: 0.6;
    }
    
    .btn-secondary {
      background: #28a745;
    }
    
    .btn-secondary:hover:not(:disabled) {
      background: #218838;
    }
    
    .btn-secondary:disabled {
      background: #ccc;
    }
    
    .result-item {
      margin-bottom: 10px;
      padding: 10px;
      background: #f8f9fa;
      border-radius: 6px;
      border-left: 4px solid #007bff;
    }
    
    .result-item strong {
      display: block;
      margin-bottom: 4px;
      color: #333;
      font-size: 15px;
    }
    
    .result-item div {
      font-size: 13px;
      color: #666;
      line-height: 1.6;
    }
    
    .input-group {
      margin-bottom: 12px;
    }
  </style>
</head>
<body>
  <!-- Control de carga de archivo -->
  <div id="fileControl" class="controlBox">
    <h3>📂 Cargar Datos</h3>
    <div class="input-group">
      <label for="fileInput">Archivo de puntos (.tsv):</label>
      <input type="file" id="fileInput" accept=".tsv">
    </div>
  </div>

  <!-- Control de algoritmos -->
  <div id="algorithmsControl" class="controlBox">
    <h3>🎯 Ejecutar Algoritmos</h3>
    <div class="input-group">
      <label for="numPoints">Número de puntos a evaluar:</label>
      <input type="number" id="numPoints" value="5" min="2" max="20">
    </div>
    <button id="runAlgorithms">▶️ Ejecutar 3 Algoritmos</button>
    <button id="exportBtn" class="btn-secondary">💾 Exportar GeoJSON</button>
  </div>

  <!-- Panel de resultados -->
  <div id="resultsContainer" class="controlBox">
    <h3>📊 Resultados</h3>
    <p style="color:#999; font-size:13px;">Los resultados aparecerán aquí después de ejecutar los algoritmos.</p>
  </div>

  <!-- Mapa -->
  <div id="map"></div>

  <!-- Scripts al final del body -->
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="main.js"></script>
</body>
</html>
