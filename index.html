<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>TSP - Path Optimizers</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗺️</text></svg>">
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Control de carga de archivo -->
  <div id="fileControl" class="controlBox">
    <h3>📂 Cargar Datos</h3>
    <div class="input-group">
      <label for="fileInput">Archivo de puntos (.tsv):</label>
      <input type="file" id="fileInput" accept=".tsv">
    </div>
    <label for="fileInput">Archivo de localidades (.osm):</label>
    <input type="file" id="osmInput" accept=".osm,application/xml">
  </div>

  <!-- Control de algoritmos -->
  <div id="algorithmsControl" class="controlBox">
    <h3>🎯 Ejecutar Algoritmos</h3>
    <div class="input-group">
      <label for="numPoints">Número de puntos a evaluar:</label>
      <input type="number" id="numPoints" value="5" min="2" max="20">
    </div>
    <button id="runAlgorithms">▶️ Ejecutar 3 Algoritmos</button>
    <button id="exportBtn" class="btn-secondary">💾 Exportar GeoJSON</button>
  </div>

  <!-- Panel de capas (nuevo - derecha arriba) -->
  <div id="layersControl" class="controlBox" style="top: 10px; right: 10px; max-width: 250px;">
    <h3>🗂️ Capas del Mapa</h3>
    <div style="display: flex; flex-direction: column; gap: 8px;">
      <label style="display: flex; align-items: center; gap: 8px; font-weight: normal;">
        <input type="checkbox" id="toggleOriginalPoints" checked>
        <span>Puntos originales (azul)</span>
      </label>
      <label style="display: flex; align-items: center; gap: 8px; font-weight: normal;">
        <input type="checkbox" id="toggleIntegratedPoints" checked>
        <span>Puntos integrados (verde)</span>
      </label>
      <label style="display: flex; align-items: center; gap: 8px; font-weight: normal;">
        <input type="checkbox" id="toggleOSM" checked>
        <span>Vías OSM</span>
      </label>
      <label style="display: flex; align-items: center; gap: 8px; font-weight: normal;">
        <input type="checkbox" id="toggleBF" checked>
        <span>Ruta Brute Force (rojo)</span>
      </label>
      <label style="display: flex; align-items: center; gap: 8px; font-weight: normal;">
        <input type="checkbox" id="toggleNN" checked>
        <span>Ruta Nearest Neighbor (verde)</span>
      </label>
      <label style="display: flex; align-items: center; gap: 8px; font-weight: normal;">
        <input type="checkbox" id="toggle2Opt" checked>
        <span>Ruta 2-Opt (azul)</span>
      </label>
    </div>
  </div>

  <!-- Panel de resultados -->
  <div id="resultsContainer" class="controlBox">
    <!-- Se llenará dinámicamente con initResultsPanel() -->
  </div>

  <!-- Mapa -->
  <div id="map"></div>

  <!-- Scripts al final del body -->
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="main.js"></script>
</body>
</html>
