<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Mapa de Puntos - Path Optimizers</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css" />
  <style>
    /* Estilo del mapa */
    #map {
      height: 100vh;
      width: 100%;
    }

    /* Estilo del botón de carga */
    #fileInputContainer {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 1000;
      background: white;
      padding: 8px 12px;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
      font-family: sans-serif;
    }

    #fileInput {
      margin-top: 5px;
    }
  </style>
</head>
<body>

  <!-- Contenedor del botón de carga -->
  <div id="fileInputContainer">
    <label for="fileInput"><b>📂 Subir archivo de puntos (.tsv):</b></label><br>
    <input type="file" id="fileInput" accept=".tsv">
  </div>

  <!-- Contenedor del mapa -->
  <div id="map"></div>

  <!-- Scripts -->
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="main.js"></script>

</body>
</html>
