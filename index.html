<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Mapa de Puntos - Path Optimizers</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css" />
  <style>
    /* Estilo del mapa */
    #map {
      height: 100vh;
      width: 100%;
    }

    /* Estilo del botón de carga */
    #fileInputContainer {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 1000;
      background: white;
      padding: 8px 12px;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
      font-family: sans-serif;
    }

    #fileInput {
      margin-top: 5px;
    }
  </style>
</head>
<body>

  <!-- Contenedor del botón de carga -->
  <div id="fileInputContainer">
    <label for="fileInput"><b>📂 Subir archivo de puntos (.tsv):</b></label><br>
    <input type="file" id="fileInput" accept=".tsv">
  </div>

  <!-- Contenedor del botón de carga para mallas OSM/JSON -->
  <div id="meshInputContainer" style="position: absolute; top: 80px; left: 10px; z-index:1000; background: white; padding:8px 12px; border-radius:8px; box-shadow:0 2px 6px rgba(0,0,0,0.3); font-family:sans-serif;">
    <label for="meshInput"><b>📁 Subir malla (.osm / .json):</b></label><br>
    <input type="file" id="meshInput" accept=".osm,.xml,.json">
    <div style="margin-top:6px; font-size:12px; color:#333">O usa la API: <code>loadOSMFromURL('resources/malla1.osm')</code></div>
    <div style="margin-top:6px; display:flex; gap:8px; align-items:center;">
      <button id="clearMeshBtn" style="font-size:12px;">Limpiar malla</button>
      <div id="meshStatus" style="font-size:12px; color:#444">Malla: <span id="meshName">(ninguna)</span></div>
    </div>
  </div>
  <!-- Contenedor del mapa -->
  <div id="map"></div>

  <!-- Scripts -->
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="main.js"></script>

</body>
</html>
